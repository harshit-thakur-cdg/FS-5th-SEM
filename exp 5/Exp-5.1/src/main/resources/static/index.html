<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REST API User Management</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #263238;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            padding: 28px 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 7px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        /* MAIN CONTAINER */
        .container {
            width: 92%;
            max-width: 1150px;
            margin: 30px auto;
        }

        /* STAT CARDS */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        }

        .stat-card span {
            display: block;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .stat-card strong {
            font-size: 27px;
            color: #1e40af;
        }

        /* FORM + SEARCH */
        .top-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 24px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 18px;
            color: #1e293b;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #475569;
        }

        input {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            margin-bottom: 14px;
            font-size: 14px;
        }

        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
        }

        /* BUTTONS */
        .buttons {
            display: flex;
            gap: 9px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .add-btn {
            background: #2563eb;
            color: white;
        }

        .update-btn {
            background: #7c3aed;
            color: white;
        }

        .clear-btn {
            background: #e2e8f0;
            color: #334155;
        }

        .search-btn {
            background: #0f766e;
            color: white;
            width: 100%;
        }

        /* SEARCH RESULT */
        #searchResult {
            margin-top: 14px;
            padding: 12px;
            background: #f1f5f9;
            border-radius: 8px;
            font-size: 14px;
            min-height: 42px;
        }

        /* TABLE CARD */
        .table-card {
            background: white;
            border-radius: 14px;
            padding: 25px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .refresh-btn {
            background: #eef2ff;
            color: #4338ca;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8fafc;
            color: #475569;
            font-size: 13px;
            text-align: left;
            padding: 13px;
            border-bottom: 2px solid #e2e8f0;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #edf2f7;
            font-size: 14px;
        }

        tr:hover {
            background: #f8fafc;
        }

        .uid {
            font-weight: bold;
            color: #2563eb;
        }

        .action-btn {
            padding: 7px 11px;
            margin-right: 5px;
            font-size: 12px;
        }

        .edit {
            background: #ede9fe;
            color: #6d28d9;
        }

        .delete {
            background: #fee2e2;
            color: #dc2626;
        }

        /* MESSAGE */
        #message {
            position: fixed;
            right: 25px;
            bottom: 25px;
            padding: 13px 18px;
            border-radius: 9px;
            display: none;
            color: white;
            font-size: 14px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .success {
            background: #16a34a;
        }

        .error {
            background: #dc2626;
        }

        /* RESPONSIVE */
        @media (max-width: 800px) {

            .top-section {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 25px;
            }

            .container {
                width: 94%;
            }

            .table-card {
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <h1>REST API User Management</h1>
    <p>Spring Boot • RESTful Services • CRUD Operations • Bean Validation</p>
</div>

<div class="container">

    <!-- STATISTICS -->
    <div class="stats">

        <div class="stat-card">
            <span>Total Users</span>
            <strong id="totalUsers">0</strong>
        </div>

        <div class="stat-card">
            <span>API Status</span>
            <strong style="font-size:20px;">Connected</strong>
        </div>

        <div class="stat-card">
            <span>Service</span>
            <strong style="font-size:20px;">Spring Boot</strong>
        </div>

    </div>


    <!-- FORM + SEARCH -->
    <div class="top-section">

        <!-- USER FORM -->
        <div class="card">

            <div class="card-title">
                User Details
            </div>

            <label for="uid">User UID</label>

            <input
                type="text"
                id="uid"
                placeholder="Enter user UID"
            >

            <label for="name">Full Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter full name"
            >

            <div class="buttons">

                <button
                    class="add-btn"
                    onclick="addUser()">
                    + Add User
                </button>

                <button
                    class="update-btn"
                    onclick="updateUser()">
                    Update
                </button>

                <button
                    class="clear-btn"
                    onclick="clearForm()">
                    Clear
                </button>

            </div>

        </div>


        <!-- SEARCH -->
        <div class="card">

            <div class="card-title">
                Find a User
            </div>

            <label for="searchUid">
                Search using UID
            </label>

            <input
                type="text"
                id="searchUid"
                placeholder="Example: 24BAI70015"
            >

            <button
                class="search-btn"
                onclick="searchUser()">
                Search User
            </button>

            <div id="searchResult">
                Search result will appear here.
            </div>

        </div>

    </div>


    <!-- USER TABLE -->
    <div class="table-card">

        <div class="table-header">

            <div class="card-title" style="margin:0;">
                Registered Users
            </div>

            <button
                class="refresh-btn"
                onclick="loadUsers()">
                ↻ Refresh
            </button>

        </div>

        <table>

            <thead>

                <tr>
                    <th>#</th>
                    <th>UID</th>
                    <th>Name</th>
                    <th>Actions</th>
                </tr>

            </thead>

            <tbody id="userTable">

            </tbody>

        </table>

    </div>

</div>


<!-- MESSAGE -->
<div id="message"></div>


<script>

const API_URL = "/api/users";


// LOAD USERS
function loadUsers() {

    fetch(API_URL)
        .then(response => response.json())
        .then(result => {

            const users = result.data || [];

            const table = document.getElementById("userTable");

            table.innerHTML = "";

            users.forEach((user, index) => {

                const row = document.createElement("tr");

                row.innerHTML = `

                    <td>${index + 1}</td>

                    <td class="uid">
                        ${user.uid}
                    </td>

                    <td>
                        ${user.name}
                    </td>

                    <td>

                        <button
                            class="action-btn edit"
                            onclick="editUser('${user.uid}', '${user.name}')">
                            Edit
                        </button>

                        <button
                            class="action-btn delete"
                            onclick="deleteUser('${user.uid}')">
                            Delete
                        </button>

                    </td>

                `;

                table.appendChild(row);

            });

            document.getElementById("totalUsers").innerText =
                users.length;

        })
        .catch(error => {

            showMessage(
                "Unable to connect to REST API",
                "error"
            );

        });
}


// ADD USER
function addUser() {

    const uid =
        document.getElementById("uid").value.trim();

    const name =
        document.getElementById("name").value.trim();

    if (!uid || !name) {

        showMessage(
            "Please enter UID and Name",
            "error"
        );

        return;
    }

    fetch(API_URL, {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            uid: uid,
            name: name
        })

    })
    .then(response => response.json())
    .then(result => {

        if (result.status === "success") {

            showMessage(
                "User added successfully",
                "success"
            );

            clearForm();

            loadUsers();

        } else {

            showMessage(
                result.message || "Unable to add user",
                "error"
            );

        }

    })
    .catch(() => {

        showMessage(
            "API request failed",
            "error"
        );

    });
}


// UPDATE USER
function updateUser() {

    const uid =
        document.getElementById("uid").value.trim();

    const name =
        document.getElementById("name").value.trim();

    if (!uid || !name) {

        showMessage(
            "Enter UID and new name",
            "error"
        );

        return;
    }

    fetch(`${API_URL}/${uid}`, {

        method: "PUT",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            uid: uid,
            name: name
        })

    })
    .then(response => response.json())
    .then(result => {

        if (result.status === "success") {

            showMessage(
                "User updated successfully",
                "success"
            );

            clearForm();

            loadUsers();

        } else {

            showMessage(
                result.message || "User not found",
                "error"
            );

        }

    });

}


// DELETE USER
function deleteUser(uid) {

    if (!confirm(
        "Are you sure you want to delete this user?"
    )) {
        return;
    }

    fetch(`${API_URL}/${uid}`, {

        method: "DELETE"

    })
    .then(response => response.json())
    .then(result => {

        if (result.status === "success") {

            showMessage(
                "User deleted successfully",
                "success"
            );

            loadUsers();

        } else {

            showMessage(
                result.message || "Unable to delete user",
                "error"
            );

        }

    });

}


// EDIT USER
function editUser(uid, name) {

    document.getElementById("uid").value = uid;

    document.getElementById("name").value = name;

    document.getElementById("name").focus();

}


// SEARCH USER
function searchUser() {

    const uid =
        document.getElementById("searchUid").value.trim();

    if (!uid) {

        showMessage(
            "Enter a UID to search",
            "error"
        );

        return;
    }

    fetch(`${API_URL}/${uid}`)

        .then(response => response.json())

        .then(result => {

            const resultBox =
                document.getElementById("searchResult");

            if (result.status === "success") {

                resultBox.innerHTML = `
                    <strong>User Found</strong><br>
                    UID: ${result.data.uid}<br>
                    Name: ${result.data.name}
                `;

            } else {

                resultBox.innerHTML =
                    `<span style="color:#dc2626;">
                        ${result.message}
                    </span>`;

            }

        })

        .catch(() => {

            document.getElementById(
                "searchResult"
            ).innerHTML =
                "Unable to connect to API.";

        });

}


// CLEAR FORM
function clearForm() {

    document.getElementById("uid").value = "";

    document.getElementById("name").value = "";

}


// MESSAGE
function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.innerText = text;

    message.className = type;

    message.style.display = "block";

    setTimeout(() => {

        message.style.display = "none";

    }, 2500);

}


// INITIAL LOAD
loadUsers();

</script>

</body>
</html>
