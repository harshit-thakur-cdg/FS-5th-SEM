<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Global Exception Handling & Structured Logging</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #222;
            min-height: 100vh;
        }

        .header {
            background: #ffffff;
            padding: 28px 50px;
            border-bottom: 1px solid #ddd;
        }

        .header h1 {
            font-size: 28px;
            color: #222;
        }

        .header p {
            margin-top: 7px;
            color: #777;
            font-size: 14px;
        }

        .container {
            width: 90%;
            max-width: 1150px;
            margin: 30px auto;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 22px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
        }

        .card h2 {
            font-size: 19px;
            margin-bottom: 20px;
            color: #333;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
            color: #555;
        }

        input {
            padding: 11px 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #555;
        }

        .buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .btn-add {
            background: #222;
            color: white;
        }

        .btn-update {
            background: #555;
            color: white;
        }

        .btn-clear {
            background: #e7e7e7;
            color: #333;
        }

        .btn-search {
            background: #222;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        .search-row {
            display: flex;
            gap: 12px;
        }

        .search-row input {
            flex: 1;
        }

        .message {
            display: none;
            padding: 13px 16px;
            border-radius: 6px;
            margin-top: 18px;
            font-size: 14px;
        }

        .success {
            background: #e9f7ef;
            color: #217346;
            border: 1px solid #b7e4c7;
        }

        .error {
            background: #fdecec;
            color: #b42318;
            border: 1px solid #f5b5b5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f5f5f5;
            text-align: left;
            padding: 13px;
            font-size: 13px;
            border-bottom: 1px solid #ddd;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .action-btn {
            padding: 7px 12px;
            font-size: 12px;
            margin-right: 5px;
        }

        .edit {
            background: #e8e8e8;
            color: #333;
        }

        .delete {
            background: #f1d4d4;
            color: #a11;
        }

        .empty {
            text-align: center;
            color: #888;
            padding: 25px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            color: #777;
            font-size: 13px;
        }

        .online {
            color: #218838;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .header {
                padding: 22px;
            }

            .container {
                width: 94%;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .search-row {
                flex-direction: column;
            }

            table {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Global Exception Handling & Structured Logging</h1>
        <p>User management with centralized error handling and request tracing</p>
    </div>

    <div class="container">

        <div class="status-bar">
            <span>Backend Status: <span class="online">● Connected</span></span>
            <span>REST API: /api/users</span>
        </div>

        <!-- USER MANAGEMENT -->
        <div class="card">

            <h2>User Management</h2>

            <div class="form-grid">

                <div class="input-group">
                    <label for="uid">UID</label>
                    <input
                        type="text"
                        id="uid"
                        placeholder="Enter user UID">
                </div>

                <div class="input-group">
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter user name">
                </div>

            </div>

            <div class="buttons">

                <button class="btn-add" onclick="addUser()">
                    Add User
                </button>

                <button class="btn-update" onclick="updateUser()">
                    Update User
                </button>

                <button class="btn-clear" onclick="clearForm()">
                    Clear
                </button>

            </div>

            <div id="managementMessage" class="message"></div>

        </div>


        <!-- SEARCH -->
        <div class="card">

            <h2>Search User</h2>

            <div class="search-row">

                <input
                    type="text"
                    id="searchUid"
                    placeholder="Enter UID to search">

                <button
                    class="btn-search"
                    onclick="searchUser()">
                    Search
                </button>

                <button
                    class="btn-clear"
                    onclick="loadUsers()">
                    Refresh
                </button>

            </div>

            <div id="searchMessage" class="message"></div>

        </div>


        <!-- USERS TABLE -->
        <div class="card">

            <h2>Users</h2>

            <table>

                <thead>
                    <tr>
                        <th>UID</th>
                        <th>Name</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="userTable">

                </tbody>

            </table>

        </div>

    </div>


    <script>

        const API = "/api/users";


        function showMessage(elementId, message, type) {

            const element = document.getElementById(elementId);

            element.textContent = message;

            element.className = "message " + type;

            element.style.display = "block";

        }


        function clearForm() {

            document.getElementById("uid").value = "";
            document.getElementById("name").value = "";

            document.getElementById("managementMessage").style.display = "none";

        }


        async function loadUsers() {

            try {

                const response = await fetch(API);

                const users = await response.json();

                const table = document.getElementById("userTable");

                table.innerHTML = "";

                if (users.length === 0) {

                    table.innerHTML = `
                        <tr>
                            <td colspan="3" class="empty">
                                No users available
                            </td>
                        </tr>
                    `;

                    return;
                }


                users.forEach(user => {

                    const row = document.createElement("tr");

                    row.innerHTML = `

                        <td>${user.uid}</td>

                        <td>${user.name}</td>

                        <td>

                            <button
                                class="action-btn edit"
                                onclick="editUser('${user.uid}', '${user.name}')">
                                Edit
                            </button>

                            <button
                                class="action-btn delete"
                                onclick="deleteUser('${user.uid}')">
                                Delete
                            </button>

                        </td>
                    `;

                    table.appendChild(row);

                });

            } catch (error) {

                showMessage(
                    "managementMessage",
                    "Unable to connect to the server.",
                    "error"
                );

            }

        }


        async function addUser() {

            const uid =
                document.getElementById("uid").value.trim();

            const name =
                document.getElementById("name").value.trim();


            if (!uid || !name) {

                showMessage(
                    "managementMessage",
                    "Please enter both UID and Name.",
                    "error"
                );

                return;
            }


            try {

                const response = await fetch(API, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        uid: uid,
                        name: name
                    })

                });


                if (!response.ok) {

                    const error = await response.json();

                    showMessage(
                        "managementMessage",
                        error.message,
                        "error"
                    );

                    return;
                }


                showMessage(
                    "managementMessage",
                    "User added successfully.",
                    "success"
                );

                clearForm();

                loadUsers();

            } catch (error) {

                showMessage(
                    "managementMessage",
                    "Unable to connect to the server.",
                    "error"
                );

            }

        }


        async function updateUser() {

            const uid =
                document.getElementById("uid").value.trim();

            const name =
                document.getElementById("name").value.trim();


            if (!uid || !name) {

                showMessage(
                    "managementMessage",
                    "Please enter UID and Name.",
                    "error"
                );

                return;
            }


            try {

                const response = await fetch(
                    `${API}/${uid}`,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            name: name
                        })
                    }
                );


                const result = await response.json();


                if (!response.ok) {

                    showMessage(
                        "managementMessage",
                        result.message,
                        "error"
                    );

                    return;
                }


                showMessage(
                    "managementMessage",
                    "User updated successfully.",
                    "success"
                );

                loadUsers();

            } catch (error) {

                showMessage(
                    "managementMessage",
                    "Unable to connect to the server.",
                    "error"
                );

            }

        }


        async function searchUser() {

            const uid =
                document.getElementById("searchUid")
                    .value.trim();


            if (!uid) {

                showMessage(
                    "searchMessage",
                    "Please enter a UID.",
                    "error"
                );

                return;
            }


            try {

                const response =
                    await fetch(`${API}/${uid}`);


                const result =
                    await response.json();


                if (!response.ok) {

                    showMessage(
                        "searchMessage",
                        result.message,
                        "error"
                    );

                    return;
                }


                document.getElementById("uid").value =
                    result.uid;

                document.getElementById("name").value =
                    result.name;


                showMessage(
                    "searchMessage",
                    `User found: ${result.name}`,
                    "success"
                );

            } catch (error) {

                showMessage(
                    "searchMessage",
                    "Unable to connect to the server.",
                    "error"
                );

            }

        }


        function editUser(uid, name) {

            document.getElementById("uid").value = uid;

            document.getElementById("name").value = name;

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        async function deleteUser(uid) {

            if (!confirm(
                `Are you sure you want to delete user ${uid}?`
            )) {
                return;
            }


            try {

                const response =
                    await fetch(`${API}/${uid}`, {
                        method: "DELETE"
                    });


                if (!response.ok) {

                    const result =
                        await response.json();

                    showMessage(
                        "managementMessage",
                        result.message,
                        "error"
                    );

                    return;
                }


                showMessage(
                    "managementMessage",
                    "User deleted successfully.",
                    "success"
                );

                loadUsers();

            } catch (error) {

                showMessage(
                    "managementMessage",
                    "Unable to connect to the server.",
                    "error"
                );

            }

        }


        // Load users when page opens
        loadUsers();

    </script>

</body>
</html>
